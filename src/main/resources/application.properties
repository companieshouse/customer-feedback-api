server.port=${SERVER_PORT:8082}
spring.mongodb.database=${MONGODB_DATABASE:customer_feedback}
spring.mongodb.uri=${MONGODB_URL:mongodb://localhost:27017}
send-email-flag=${SEND_EMAIL_FLAG:true}
customer-feedback-email=${CUSTOMER_FEEDBACK_EMAIL:main.feedback@companieshouse.gov.uk}
kafka-api-endpoint=${KAFKA_API_ENDPOINT}
app-id=${APP_ID:api_ch_gov_uk.create_feedback}

# OpenTelemetry configuration
management.opentelemetry.enabled=${OTEL_LOG_ENABLED:false}
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/logs
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/traces
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/metrics
